markdown: kramdown

# GoatCounter site code: analytics load only when this is set (https://<code>.goatcounter.com)
goatcounter_code: runpengluo

profile_picture: "https://runpengluo.github.io/researcher/files/selfies.jpg"
og_image: "https://runpengluo.github.io/researcher/files/selfies.jpg"

footer: yes
footer_url: "https://github.com/ankitsultana"
